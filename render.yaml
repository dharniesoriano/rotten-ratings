services:
  - type: web
    name: rotten-ratings
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OMDB_API_KEY
        sync: false # Render asks you for this during setup
      - key: MDBLIST_API_KEY
        sync: false # optional: enables the Letterboxd list
      - key: PUBLIC_URL
        value: https://rotten-ratings.onrender.com # where the TV fetches rated posters
